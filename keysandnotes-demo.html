<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ноты и клавиши — демо</title>
<style>
  :root{
    --bg:#1b1f2a; --panel:#242a38; --accent:#6ea8fe; --good:#3ecf8e; --bad:#ff5d6c; --ink:#eef1f8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; background:radial-gradient(circle at 20% -10%, #2c3550, var(--bg));
    font-family:'Segoe UI', system-ui, sans-serif; color:var(--ink); display:flex; flex-direction:column; align-items:center;
    padding:16px 12px; overflow-x:hidden;
  }
  h1{font-size:22px; margin:0 0 4px;}
  p.sub{color:#9aa4bd; margin:0 0 14px; font-size:14px;}
  #hud{display:flex; gap:16px; align-items:center; margin-bottom:12px; font-size:15px; flex-wrap:wrap; justify-content:center;}
  #hud span{background:var(--panel); padding:6px 14px; border-radius:10px;}
  #restart{cursor:pointer; background:var(--accent); border:none; color:#111; font-weight:600; padding:7px 16px; border-radius:10px;}
  #fullscreenBtn{cursor:pointer; background:var(--panel); border:1px solid #3a4257; color:var(--ink); font-weight:600; padding:7px 16px; border-radius:10px;}
  #fullscreenBtn.active{background:var(--accent); color:#111; border-color:var(--accent);}
  #levels{display:flex; gap:8px;}
  .level-btn{
    cursor:pointer; background:var(--panel); border:1px solid #3a4257; color:var(--ink);
    padding:7px 14px; border-radius:10px; font-size:14px;
  }
  .level-btn.active{background:var(--accent); color:#111; border-color:var(--accent); font-weight:600;}
  .level-stub{
    position:relative; cursor:help; user-select:none; font-family:inherit;
    background:var(--panel); border:1px solid #3a4257; color:#7d8699;
    padding:7px 14px; border-radius:10px; font-size:14px;
  }
  .level-stub .stub-tip{
    position:absolute; bottom:calc(100% + 8px); left:50%;
    transform:translateX(-50%) translateY(4px);
    background:#10141f; color:var(--ink); border:1px solid #3a4257;
    padding:8px 12px; border-radius:10px; font-size:13px; white-space:nowrap;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease; z-index:60;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .level-stub:hover .stub-tip, .level-stub:focus-visible .stub-tip{
    opacity:1; visibility:visible; transform:translateX(-50%) translateY(0);
  }
  #board{
    position:relative; width:100%; max-width:1500px; background:var(--panel); border-radius:16px; padding:16px;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
  }
  #pool{
    position:relative; height:180px; width:100%; margin-bottom:8px; touch-action:none;
  }
  .note-card{
    position:absolute; cursor:grab; user-select:none; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
    touch-action:none; transition:width .25s, left .25s, top .25s, bottom .25s;
  }
  .note-card img{display:block; width:100%; pointer-events:none; -webkit-user-drag:none;}
  .note-card.dragging{cursor:grabbing; z-index:50; transition:none;}
  #pianoWrap{position:relative;}
  #piano{position:relative; width:100%;}
  .wkey{
    position:absolute; top:0; background:#f7f7fb; border:1px solid #333; border-radius:0 0 6px 6px;
    transition:background .25s, filter .25s;
  }
  .wkey.dim{ background:#8a90a3; filter:brightness(.8) saturate(.75); }
  .wkey.correct{background:var(--good) !important; filter:none !important;}
  .wkey.wrong{background:var(--bad) !important; filter:none !important;}
  .bkey{
    position:absolute; top:0; background:#1a1a1a; border-radius:0 0 5px 5px; z-index:5;
    transition:filter .25s;
  }
  .bkey.dim{ filter:brightness(2.6) opacity(.6); }
  .wkey.center-mark::after{
    content:'До1';
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    color:#c92d40;
    font-size:clamp(10px, 1.15vw, 14px);
    font-weight:800;
    white-space:nowrap;
    line-height:1.2;
    pointer-events:none;
  }
  .octave-bracket{
    position:absolute; border-left:2px solid #8a93ad; border-right:2px solid #8a93ad; border-bottom:2px solid #8a93ad;
    border-radius:0 0 6px 6px;
  }
  .octave-label{
    position:absolute; text-align:center; font-size:13px; color:#9aa4bd; letter-spacing:.02em;
  }
  #msg{
    text-align:center; margin-top:16px; font-size:18px; min-height:26px; color:var(--good); font-weight:600;
  }

  /* ---------- Экран завершения уровня ---------- */
  #overlay{
    position:fixed; inset:0; z-index:100; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(10,13,20,.72); backdrop-filter:blur(4px);
  }
  #overlay.show{display:flex;}
  .overlay-card{
    background:var(--panel); border-radius:20px; padding:32px 28px; max-width:420px; width:100%;
    text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.5);
    animation:pop .45s cubic-bezier(.2,1.4,.4,1);
    border:1px solid #3a4257;
  }
  @keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  .overlay-emoji{font-size:56px; line-height:1; margin-bottom:12px;}
  .overlay-title{font-size:24px; font-weight:700; margin:0 0 10px;}
  .overlay-title.good{color:var(--good);}
  .overlay-title.bad{color:var(--bad);}
  .overlay-text{font-size:16px; color:#c6cde0; margin:0 0 22px; line-height:1.5;}
  .overlay-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .overlay-btn{
    cursor:pointer; border:none; font-weight:600; font-size:16px;
    padding:12px 22px; border-radius:12px; min-height:48px; min-width:44px;
  }
  .overlay-btn.primary{background:var(--accent); color:#111;}
  .overlay-btn.ghost{background:transparent; border:1px solid #3a4257; color:var(--ink);}
  #confettiCanvas{position:fixed; inset:0; z-index:101; pointer-events:none; display:none;}
  /* Игровая палитра курса «Ноты — легко»: оформление без изменений механики */
  :root{--bg:#fff6ee;--panel:#fffdfb;--accent:#e98a79;--good:#329b73;--bad:#df6474;--ink:#593d3b;}
  body{background:radial-gradient(circle at 8% 12%,#ffe0d4 0,transparent 29%),radial-gradient(circle at 94% 5%,#fbe4aa 0,transparent 27%),linear-gradient(160deg,#fffaf2,#f9e8e3 70%,#f7e9db);color:var(--ink);padding:22px 12px 28px;}
  h1{font-size:clamp(26px,3vw,36px);font-weight:800;letter-spacing:-.035em;color:#76453f;text-shadow:0 2px 0 #fff;}
  p.sub{color:#996e68;font-size:15px;margin:3px 0 19px;}
  #hud{gap:10px;margin-bottom:17px;}
  #hud span{background:#fffaf7;border:1px solid #eed3c8;border-radius:999px;color:#85564e;font-weight:750;padding:10px 16px;box-shadow:0 3px 0 #f0d9ce;}
  #levels{gap:7px;flex-wrap:wrap;justify-content:center;}
  .level-btn{background:#fffdf9;border:2px solid #edd2c7;color:#815b55;border-radius:999px;padding:9px 15px;font-weight:750;box-shadow:0 3px 0 #edd9d0;transition:transform .15s,background .15s,box-shadow .15s;}
  .level-btn:hover,#restart:hover,#fullscreenBtn:hover,.overlay-btn:hover{transform:translateY(-2px);}
  .level-btn.active{background:#e98a79;border-color:#d76f63;color:#fff;box-shadow:0 4px 0 #b95e57;}
  #restart,#fullscreenBtn{border-radius:999px;padding:10px 17px;font-weight:750;transition:transform .15s;}
  #restart{background:#f1ad60;color:#593d3b;border:2px solid #e99c4b;box-shadow:0 3px 0 #d99143;}
  #fullscreenBtn{background:#fffdf9;color:#815b55;border:2px solid #edd2c7;box-shadow:0 3px 0 #edd9d0;}
  #fullscreenBtn.active{background:#e98a79;color:white;border-color:#d76f63;}
  #board{background:linear-gradient(180deg,#fffdfa,#fff8f3);border:3px solid #f1d8ca;border-radius:26px;padding:clamp(12px,2vw,24px);box-shadow:0 10px 0 #e9cbbf,0 24px 45px rgba(132,81,69,.15);}
  .note-card{filter:drop-shadow(0 5px 4px rgba(115,74,63,.18));}
  .wkey{background:#fff;border-color:#9c8982;box-shadow:inset 0 -7px 0 #f1e9e3;}
  .wkey.dim{background:#c9bdb7;filter:brightness(.94) saturate(.75);}
  .wkey.correct{background:#73d9b2!important;box-shadow:inset 0 -7px 0 #49b98f!important;}
  .wkey.wrong{background:#f38b98!important;box-shadow:inset 0 -7px 0 #dd6877!important;}
  .bkey{background:linear-gradient(90deg,#34302f,#171717 60%,#3b3533);box-shadow:2px 3px 3px #79645a55;}
  .wkey.center-mark::after{color:#c64e56;background:#fff1e9;border-radius:7px;padding:2px 4px;bottom:11px;}
  .octave-bracket{border-color:#bc8e82;}
  .octave-label{color:#966c61;font-weight:650;}
  #msg{color:#328d69;font-size:18px;}
  #overlay{background:rgba(70,40,45,.58);backdrop-filter:blur(6px);}
  .overlay-card{background:linear-gradient(160deg,#fffefa,#fff0e9);border:3px solid #f1d1c1;border-radius:28px;max-width:470px;padding:35px 30px;box-shadow:0 12px 0 #d7aaa0,0 28px 70px #3e242c55;}
  .overlay-emoji{font-size:62px;}
  .overlay-title{color:#784841;font-size:27px;}
  .overlay-title.good{color:#278e68;}
  .overlay-title.bad{color:#c94e64;}
  .overlay-text{color:#805e58;font-size:17px;}
  .overlay-btn{border-radius:999px;transition:transform .15s;}
  .overlay-btn.primary{background:#e98a79;color:white;border:2px solid #d66c61;box-shadow:0 4px 0 #b75a51;}
  .overlay-btn.ghost{background:white;border:2px solid #e9c9bd;color:#80534b;box-shadow:0 4px 0 #e9d7ce;}
  @media(max-width:650px){#hud{gap:8px}.level-btn{padding:8px 11px;font-size:12px}#restart,#fullscreenBtn{font-size:12px;padding:9px 12px}#board{border-radius:17px;padding:10px}.overlay-card{padding:27px 18px}}

  /* Недоступные уровни: сохраняем заглушки, оформляем как кнопки полной игры */
  .level-stub{background:#f7eee9;border:2px dashed #ddc5bc;color:#a18b83;border-radius:999px;padding:9px 15px;font-size:14px;font-weight:750;box-shadow:0 3px 0 #eadbd4;cursor:help;}
  .level-stub .stub-tip{background:#fffdf9;color:#815b55;border:2px solid #e9c9bd;border-radius:12px;box-shadow:0 8px 24px rgba(113,72,61,.18);}
  @media(max-width:650px){.level-stub{padding:8px 11px;font-size:12px}.level-stub .stub-tip{white-space:normal;width:180px;}}
</style>
</head>
<body>

<h1>🎹 Ноты и клавиши</h1>
<p class="sub">Перетащи ноту на нужную клавишу</p>

<div id="hud">
  <div id="levels">
    <button class="level-btn active" data-level="1">Уровень 1</button>
    <button type="button" class="level-stub" aria-disabled="true">Уровень 2<span class="stub-tip">Доступно в полной версии игры</span></button>
    <button type="button" class="level-stub" aria-disabled="true">Уровень 3<span class="stub-tip">Доступно в полной версии игры</span></button>
    <button type="button" class="level-stub" aria-disabled="true">Уровень 4<span class="stub-tip">Доступно в полной версии игры</span></button>
    <button type="button" class="level-stub" aria-disabled="true">Уровень 5<span class="stub-tip">Доступно в полной версии игры</span></button>
  </div>
  <span id="score">Верно: 0 / 0</span>
  <button id="restart">Начать заново</button>
  <button id="fullscreenBtn">⛶ На весь экран</button>
</div>

<div id="board">
  <div id="pool"></div>
  <div id="pianoWrap"><div id="piano"></div></div>
</div>
<div id="msg"></div>

<div id="overlay">
  <div class="overlay-card">
    <div class="overlay-emoji" id="overlayEmoji">🎉</div>
    <h2 class="overlay-title" id="overlayTitle"></h2>
    <p class="overlay-text" id="overlayText"></p>
    <div class="overlay-actions">
      <button class="overlay-btn primary" id="overlayMainBtn"></button>
      <button class="overlay-btn ghost" id="overlayCloseBtn">Закрыть</button>
    </div>
  </div>
</div>
<canvas id="confettiCanvas"></canvas>

// ---------- Полный набор нот, для которых есть картинки ----------
const GAME_NOTES = [
  'C2','D2','E2','F2','G2','A2','B2',
  'C3','D3','E3','F3','G3','A3','B3',
  'C4','D4','E4','F4','G4','A4','B4',
  'C5','D5','E5','F5','G5','A5','B5',
  'C6'
];

const LETTERS = ['C','D','E','F','G','A','B'];
const LETTER_IDX = {C:0,D:1,E:2,F:3,G:4,A:5,B:6};
const BLACK_AFTER = {C:true,D:true,F:true,G:true,A:true};
const OCT_LABELS = {3:'малая октава', 4:'первая октава', 5:'вторая октава'};

function diatonicVal(note){
  const letter = note[0], oct = parseInt(note[1]);
  return oct*7 + LETTER_IDX[letter];
}

// ---------- Клавиатура ----------
// Малая клавиатура: малая + первая октавы + замыкающая До второй
function buildSmallKeyboard(){
  const keys = [];
  for(const oct of [3,4]){
    for(const letter of LETTERS) keys.push({letter, oct});
  }
  keys.push({letter:'C', oct:5});
  return keys;
}
let whiteKeys = [];

// ---------- Уровни ----------
const LEVELS = {
  1: {from:'A3', to:'E4'},
};
let currentLevel = 1;

const piano = document.getElementById('piano');
const pianoWrap = document.getElementById('pianoWrap');
const board = document.getElementById('board');
let WHITE_W, WHITE_H, BLACK_W, BLACK_H, CARD_W, POOL_CARD_W, ACTIVE_CENTER_X;

function levelNotes(levelId){
  const lv = LEVELS[levelId];
  const from = diatonicVal(lv.from), to = diatonicVal(lv.to);
  return GAME_NOTES.filter(n=>{
    const v = diatonicVal(n);
    return v>=from && v<=to;
  });
}

function layoutPiano(){
  const lv = LEVELS[currentLevel];
  whiteKeys = buildSmallKeyboard();

  const availW = board.clientWidth - 32;
  WHITE_W = availW / whiteKeys.length;
  WHITE_H = Math.max(120, Math.min(240, window.innerHeight * 0.30));
  BLACK_W = WHITE_W * 0.55;
  BLACK_H = WHITE_H * 0.6;
  CARD_W = WHITE_W * 0.9;
  // Карточки в пуле всегда крупные (как на маленькой клавиатуре), а не подстраиваются
  // под количество клавиш текущего уровня — уменьшаются только при установке на клавишу.
  POOL_CARD_W = Math.max(CARD_W, (availW/15) * 0.85);

  piano.style.height = WHITE_H + 'px';
  piano.innerHTML = '';
  pianoWrap.querySelectorAll('.octave-bracket, .octave-label').forEach(e=>e.remove());
  pianoWrap.style.paddingBottom = '38px';

  const activeFrom = diatonicVal(lv.from), activeTo = diatonicVal(lv.to);
  let activeMinX = null, activeMaxX = null;

  whiteKeys.forEach((k,i)=>{
    k.x = i * WHITE_W;
    const el = document.createElement('div');
    el.className='wkey';
    const val = diatonicVal(k.letter+k.oct);
    if(val<activeFrom || val>activeTo){
      el.classList.add('dim');
    } else {
      if(activeMinX===null) activeMinX = k.x;
      activeMaxX = k.x + WHITE_W;
    }
    if(k.letter==='C' && k.oct===4) el.classList.add('center-mark');
    el.style.left = k.x+'px';
    el.style.width = WHITE_W+'px';
    el.style.height = WHITE_H+'px';
    el.dataset.note = k.letter+k.oct;
    piano.appendChild(el);
    k.el = el;
  });
  whiteKeys.forEach(k=>{
    if(BLACK_AFTER[k.letter]){
      const val1 = diatonicVal(k.letter+k.oct);
      const nextIdx = LETTERS.indexOf(k.letter)+1;
      const nextLetter = nextIdx<7 ? LETTERS[nextIdx] : 'C';
      const nextOct = nextIdx<7 ? k.oct : k.oct+1;
      const val2 = diatonicVal(nextLetter+nextOct);
      const b = document.createElement('div');
      b.className='bkey';
      if(val1<activeFrom || val1>activeTo || val2<activeFrom || val2>activeTo) b.classList.add('dim');
      b.style.left = (k.x + WHITE_W - BLACK_W/2) + 'px';
      b.style.width = BLACK_W + 'px';
      b.style.height = BLACK_H + 'px';
      piano.appendChild(b);
    }
  });

  ACTIVE_CENTER_X = (activeMinX + activeMaxX) / 2;

  // ---------- Скобки октав ----------
  let groups = [];
  whiteKeys.forEach((k,i)=>{
    let g = groups[groups.length-1];
    if(!g || g.oct!==k.oct){ groups.push({oct:k.oct, start:i, end:i}); }
    else { g.end = i; }
  });
  groups.forEach(g=>{
    const xStart = g.start*WHITE_W;
    const xEnd = (g.end+1)*WHITE_W;
    const bracket = document.createElement('div');
    bracket.className='octave-bracket';
    bracket.style.left = xStart+'px';
    bracket.style.top = WHITE_H+'px';
    bracket.style.width = (xEnd-xStart)+'px';
    bracket.style.height = '10px';
    pianoWrap.appendChild(bracket);

    const label = document.createElement('div');
    label.className='octave-label';
    label.textContent = OCT_LABELS[g.oct] || '';
    label.style.left = xStart+'px';
    label.style.top = (WHITE_H+12)+'px';
    label.style.width = (xEnd-xStart)+'px';
    pianoWrap.appendChild(label);
  });

  // переразместить уже закреплённые карточки и карточки в пуле
  cards.forEach(n=>{
    if(!n.el) return; // карточки ещё не созданы (первый вызов при старте игры)
    if(n.placed){
      placeCardOnKey(n);
    } else {
      n.el.style.width = POOL_CARD_W+'px';
      n.pos = null;
    }
  });
  layoutPool();
}

function keyRect(note){
  return whiteKeys.find(w=>w.letter+w.oct===note);
}

// ---------- Частоты для звука ----------
const SEMITONES = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function freq(letter,oct){
  const midi = (oct+1)*12 + SEMITONES[letter];
  return 440 * Math.pow(2,(midi-69)/12);
}
let actx;
function playTone(note){
  const letter = note[0], oct = parseInt(note[1]);
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  const o = actx.createOscillator(), g = actx.createGain();
  o.type='triangle'; o.frequency.value = freq(letter,oct);
  g.gain.value=0.18; o.connect(g); g.connect(actx.destination);
  o.start(); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.5);
  o.stop(actx.currentTime+0.5);
}

// ---------- Игровое состояние ----------
let total=0, correct=0, cards=[];
let mistakeMade=false; // была ли ошибка на текущем уровне
const pool = document.getElementById('pool');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');

function layoutPool(){
  const w = pool.clientWidth;
  const cardH = POOL_CARD_W * 0.62; // примерное соотношение сторон картинок нот
  const gapX = 14, gapY = 10;
  const maxCols = Math.max(1, Math.floor((w+gapX) / (POOL_CARD_W+gapX)));
  const unplaced = cards.filter(n=>n.el && !n.placed);
  const cols = Math.max(1, Math.min(maxCols, unplaced.length));
  const rows = Math.max(1, Math.ceil(unplaced.length / cols));
  pool.style.height = (rows*(cardH+gapY) + gapY) + 'px';

  // центрируем всю сетку карточек над рабочим (подсвеченным) участком клавиатуры
  const gridW = cols*(POOL_CARD_W+gapX) - gapX;
  let startX = (ACTIVE_CENTER_X!=null ? ACTIVE_CENTER_X : w/2) - gridW/2;
  startX = Math.max(4, Math.min(startX, w - gridW - 4));

  unplaced.forEach((n,i)=>{
    n.el.style.width = POOL_CARD_W+'px';
    if(!n.pos){
      const col = i % cols;
      const row = Math.floor(i / cols);
      n.pos = {
        x: startX + col*(POOL_CARD_W+gapX) + (Math.random()*6-3),
        y: gapY/2 + row*(cardH+gapY) + (Math.random()*4-2)
      };
    }
    n.el.style.position = 'absolute';
    n.el.style.left = n.pos.x+'px';
    n.el.style.top = n.pos.y+'px';
    n.el.style.bottom = '';
  });
}

function updateScore(){
  scoreEl.textContent = `Верно: ${correct} / ${total}`;
}

function placeCardOnKey(n){
  const k = keyRect(n.note);
  const el = n.el;
  if(el.parentElement !== piano) piano.appendChild(el);
  el.style.width = CARD_W+'px';
  el.style.left = (k.x + (WHITE_W-CARD_W)/2) + 'px';
  el.style.top = '';
  el.style.bottom = '8px';
  el.style.cursor = 'default';
  el.style.pointerEvents = 'none';
}

function startGame(){
  pool.innerHTML='';
  msgEl.textContent='';
  mistakeMade=false;
  hideLevelEnd();
  document.querySelectorAll('.level-btn').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.level)===currentLevel);
  });

  const notes = levelNotes(currentLevel);
  cards = notes.slice().sort(()=>Math.random()-0.5).map(note=>({note, pos:null, placed:false}));
  total = cards.length; correct = 0;
  updateScore();

  layoutPiano(); // пересчитать подсветку рабочего участка под текущий уровень

  cards.forEach(n=>{
    const el = document.createElement('div');
    el.className='note-card';
    el.style.width=POOL_CARD_W+'px';
    const img = document.createElement('img');
    img.src = NOTE_IMAGES[n.note];
    el.appendChild(img);
    n.el = el;
    pool.appendChild(el);
    attachDrag(n);
  });
  layoutPool();
}

function attachDrag(n){
  const el = n.el;
  let offX=0, offY=0, dragging=false;

  el.addEventListener('pointerdown', e=>{
    if(n.placed) return;
    dragging = true;
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    offX = e.clientX - r.left;
    offY = e.clientY - r.top;
  });

  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    el.style.position='fixed';
    el.style.left = (e.clientX-offX)+'px';
    el.style.top = (e.clientY-offY)+'px';
    el.style.bottom = '';
  });

  el.addEventListener('pointerup', e=>{
    if(!dragging) return;
    dragging=false;
    el.classList.remove('dragging');
    el.style.position='';

    const target = document.elementFromPoint(e.clientX, e.clientY);
    const keyEl = target && target.closest('.wkey');

    if(keyEl){
      if(keyEl.dataset.note === n.note){
        keyEl.classList.remove('wrong');
        keyEl.classList.add('correct');
        n.placed = true;
        correct++; updateScore();
        playTone(n.note);
        placeCardOnKey(n);
        if(correct===total){
          msgEl.textContent = mistakeMade ? 'Все ноты расставлены. Но были ошибки — попробуй ещё раз!' : '🎉 Отлично! Все ноты найдены верно!';
          setTimeout(showLevelEnd, 600);
        }
      } else {
        mistakeMade = true;
        keyEl.classList.add('wrong');
        setTimeout(()=>keyEl.classList.remove('wrong'),400);
        snapBack();
      }
    } else {
      snapBack();
    }

    function snapBack(){
      el.style.position='absolute';
      el.style.left = n.pos.x+'px';
      el.style.top = n.pos.y+'px';
      el.style.bottom = '';
    }
  });
}

// ---------- Экран завершения уровня ----------
const overlay = document.getElementById('overlay');
const overlayEmoji = document.getElementById('overlayEmoji');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const overlayMainBtn = document.getElementById('overlayMainBtn');
const overlayCloseBtn = document.getElementById('overlayCloseBtn');

function showLevelEnd(){
  if(mistakeMade){
    overlayEmoji.textContent = '😔';
    overlayTitle.textContent = 'Мне жаль, но были ошибки.';
    overlayTitle.className = 'overlay-title bad';
    overlayText.textContent = 'Давай попробуем еще раз';
    overlayMainBtn.textContent = 'Попробовать еще раз';
    overlayMainBtn.onclick = ()=>{ hideLevelEnd(); startGame(); };
  } else {
    overlayEmoji.textContent = '🎉';
    overlayTitle.textContent = 'Ура! Все верно!';
    overlayTitle.className = 'overlay-title good';
    overlayText.innerHTML = 'Полная версия игры доступна в курсе<br><span style="white-space:nowrap">"Ноты - легко"</span>';
    overlayMainBtn.textContent = 'Играть снова';
    overlayMainBtn.onclick = ()=>{
      hideLevelEnd();
      startGame();
    };
    launchConfetti();
  }
  overlay.classList.add('show');
}
function hideLevelEnd(){
  overlay.classList.remove('show');
  stopConfetti();
}
overlayCloseBtn.addEventListener('click', hideLevelEnd);

// ---------- Салют (конфетти) ----------
const confettiCanvas = document.getElementById('confettiCanvas');
const cctx = confettiCanvas.getContext('2d');
let confettiRAF = null;
const CONFETTI_COLORS = ['#6ea8fe','#3ecf8e','#ff5d6c','#ffd166','#c792ea','#4dd0e1','#f78c6c'];

function launchConfetti(){
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  confettiCanvas.style.display = 'block';
  const parts = [];
  const W = confettiCanvas.width, H = confettiCanvas.height;
  for(let i=0;i<160;i++){
    parts.push({
      x: Math.random()*W,
      y: -20 - Math.random()*H*0.5,
      w: 6+Math.random()*6,
      h: 8+Math.random()*8,
      vx: (Math.random()-0.5)*2.2,
      vy: 2+Math.random()*3.5,
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.25,
      color: CONFETTI_COLORS[i % CONFETTI_COLORS.length]
    });
  }
  const start = performance.now();
  function frame(t){
    cctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.02;
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      cctx.restore();
    }
    if(t - start < 3500){
      confettiRAF = requestAnimationFrame(frame);
    } else {
      stopConfetti();
    }
  }
  cancelAnimationFrame(confettiRAF);
  confettiRAF = requestAnimationFrame(frame);
}
function stopConfetti(){
  cancelAnimationFrame(confettiRAF);
  confettiRAF = null;
  confettiCanvas.style.display = 'none';
  cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
}

document.getElementById('restart').addEventListener('click', startGame);
document.querySelectorAll('.level-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    currentLevel = parseInt(b.dataset.level);
    startGame();
  });
});
window.addEventListener('resize', layoutPiano);

// ---------- Полноэкранный режим ----------
const fsBtn = document.getElementById('fullscreenBtn');
fsBtn.addEventListener('click', ()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', ()=>{
  const isFs = !!document.fullscreenElement;
  fsBtn.classList.toggle('active', isFs);
  fsBtn.textContent = isFs ? '⤢ Выйти из полного экрана' : '⛶ На весь экран';
  setTimeout(layoutPiano, 50); // пересчитать размеры после смены режима
});

layoutPiano();
startGame();
</script>
